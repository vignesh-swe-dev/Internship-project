<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Thinkinfo Expert Solutions — Intern Feedback</title>
    <link rel="icon" href="./Assets/logo.png" type="image/png">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg-0: #020608;
            --cyan: #0ef;
            --cyan-dim: rgba(14, 239, 255, .25);
            --cyan-glow: 0 0 12px rgba(14, 239, 255, .3);
            --green: #00e676;
            --green-dim: rgba(0, 230, 118, .2);
            --green-glow: 0 0 12px rgba(0, 230, 118, .25);
            --red: #ff3a4a;
            --red-dim: rgba(255, 58, 74, .25);
            --amber: #ffaa00;
            --amber-dim: rgba(255, 170, 0, .25);
            --text: #b8d4e8;
            --text-dim: #4e6a7d;
            --border: rgba(14, 239, 255, .12);
            --radius: 10px;
            --sidebar-w: 220px
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-0);
            color: var(--text);
            display: flex;
            position: relative
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(0, 0, 0, .07) 3px, rgba(0, 0, 0, .07) 4px);
            pointer-events: none;
            z-index: 999
        }

        #matrixCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .45
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: rgba(10, 15, 24, .85);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 20;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        .sidebar::-webkit-scrollbar {
            width: 4px
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 16px;
            border-bottom: 1px solid var(--border)
        }

        .sidebar-title {
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: rgba(14, 239, 255, .04);
            border-bottom: 1px solid var(--border)
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--amber), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .92rem;
            font-weight: 700;
            color: #000;
            flex-shrink: 0
        }

        .user-info {
            flex: 1;
            min-width: 0
        }

        .user-name {
            font-size: .78rem;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .user-role {
            font-size: .68rem;
            color: var(--text-dim);
            margin-top: 1px
        }

        .nav {
            padding: 8px 0
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: .82rem;
            border-left: 3px solid transparent;
            transition: background .2s, color .2s, border-color .2s;
            position: relative
        }

        .nav-link svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0
        }

        .nav-link:hover {
            background: rgba(14, 239, 255, .06);
            color: var(--text)
        }

        .nav-link.active {
            background: rgba(14, 239, 255, .12);
            color: var(--cyan);
            border-left-color: var(--cyan);
            box-shadow: inset 0 0 16px rgba(14, 239, 255, .08)
        }

        .nav-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--amber);
            color: #000;
            font-size: .6rem;
            font-weight: 800;
            border-radius: 8px;
            padding: 2px 6px;
            animation: pulse 2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .5
            }
        }

        .main-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
            z-index: 10;
            overflow: hidden
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 24px;
            flex-shrink: 0;
            background: rgba(10, 15, 24, .85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 16px rgba(0, 0, 0, .4)
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .menu-toggle {
            display: none;
            width: 32px;
            height: 32px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            align-items: center;
            justify-content: center
        }

        .menu-toggle svg {
            width: 18px;
            height: 18px
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: .5px
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .76rem
        }

        .breadcrumb-link {
            color: var(--cyan);
            text-decoration: none
        }

        .breadcrumb-sep,
        .breadcrumb-current {
            color: var(--text-dim)
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        .panel {
            background: rgba(10, 15, 24, .88);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0, 0, 0, .4);
            overflow: hidden;
            transition: border-color .3s;
            max-width: 700px
        }

        .panel:hover {
            border-color: var(--cyan-dim)
        }

        .panel-header {
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, rgba(14, 239, 255, .1), rgba(14, 239, 255, .03))
        }

        .panel-title {
            font-size: .84rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: .5px;
            text-transform: uppercase
        }

        .panel-body {
            padding: 24px
        }

        .form-group {
            margin-bottom: 18px
        }

        .form-label {
            display: block;
            font-size: .75rem;
            letter-spacing: .5px;
            color: var(--text);
            margin-bottom: 7px;
            font-weight: 600;
            text-transform: uppercase
        }

        .req {
            color: var(--red);
            margin-left: 2px
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(6, 36, 61, .6);
            border: 1px solid rgba(14, 239, 255, .15);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: .88rem;
            outline: none;
            transition: border-color .3s, box-shadow .3s
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--cyan);
            background: rgba(6, 36, 61, .85);
            box-shadow: 0 0 12px var(--cyan-dim)
        }

        .form-input.error,
        .form-select.error,
        .form-textarea.error {
            border-color: var(--red)
        }

        .form-select option {
            background: #0a0f18;
            color: #fff
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5
        }

        .rating-row {
            display: flex;
            gap: 8px;
            margin-top: 4px
        }

        .star {
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: color .15s, transform .15s
        }

        .star:hover,
        .star.active {
            color: var(--amber);
            transform: scale(1.15);
            text-shadow: 0 0 10px var(--amber)
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 22px;
            border-radius: 7px;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: .4px;
            transition: all .2s;
            border: 1px solid transparent
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn svg {
            width: 14px;
            height: 14px
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(0, 230, 118, .2), rgba(0, 230, 118, .1));
            border-color: var(--green-dim);
            color: var(--green)
        }

        .btn-success:hover {
            background: linear-gradient(135deg, rgba(0, 230, 118, .32), rgba(0, 230, 118, .18));
            border-color: var(--green);
            box-shadow: var(--green-glow)
        }

        .btn-danger {
            background: none;
            border-color: var(--border);
            color: var(--text-dim)
        }

        .btn-danger:hover {
            background: rgba(255, 58, 74, .1);
            border-color: var(--red-dim);
            color: var(--red)
        }

        .toast-wrap {
            position: fixed;
            bottom: 60px;
            right: 24px;
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 8px;
            background: rgba(10, 15, 24, .96);
            border: 1px solid var(--green-dim);
            color: var(--green);
            font-size: .8rem;
            font-weight: 600;
            box-shadow: var(--green-glow), 0 8px 24px rgba(0, 0, 0, .5);
            animation: toastIn .3s ease;
            max-width: 300px
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .toast.out {
            animation: toastOut .35s ease forwards
        }

        @keyframes toastOut {
            from {
                opacity: 1
            }

            to {
                opacity: 0;
                transform: translateX(30px)
            }
        }

        .toast.warn {
            border-color: var(--amber-dim);
            color: var(--amber)
        }

        .footer {
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-top: 1px solid var(--border);
            font-size: .7rem;
            color: var(--text-dim);
            background: rgba(10, 15, 24, .6)
        }

        @media(max-width:900px) {
            :root {
                --sidebar-w: 0
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 240px;
                transform: translateX(-100%);
                transition: transform .3s;
                z-index: 100
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 24px rgba(0, 0, 0, .6)
            }

            .menu-toggle {
                display: flex
            }

            .panel {
                max-width: 100%
            }
        }
    </style>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><img src="./Assets/logo.png" alt="TES Logo" width="40" height="40"
                onerror="this.style.display='none'" /><span class="sidebar-title">Intern Panel</span></div>
        <div class="user-card">
            <div class="user-avatar">I</div>
            <div class="user-info">
                <div class="user-name">Intern User</div>
                <div class="user-role">Intern</div>
            </div>
        </div>
        <nav class="nav">
            <a href="intern-home.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                </svg><span>Home</span></a>
            <a href="intern-profile-edit.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg><span>View/Edit Profile</span></a>
            <a href="intern-attendance.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                </svg><span>View Attendance</span></a>
            <a href="intern-notifications.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg><span>View Notifications</span><span class="nav-badge">3</span></a>
            <a href="intern-apply-leave.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M9 8h6m-6 4h6m-6 4h4" />
                </svg><span>Apply For Leave</span></a>
            <a href="intern-feedback.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg><span>Feedback</span></a>
            <a href="javascript:void(0);" onclick="ThinkAPI.logout()" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg><span>Logout</span></a>
        </nav>
    </aside>
    <div class="main-wrap">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg></button>
                <h1 class="page-title">Feedback</h1>
            </div>
            <div class="breadcrumb"><a href="intern-home.html" class="breadcrumb-link">Home</a><span
                    class="breadcrumb-sep">/</span><span class="breadcrumb-current">Feedback</span></div>
        </header>
        <main class="content">
            <div class="panel">
                <div class="panel-header"><svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2"
                        width="16" height="16">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg><span class="panel-title">Share Your Feedback</span></div>
                <div class="panel-body">
                    <div class="form-group"><label class="form-label">Feedback Category <span
                                class="req">*</span></label><select class="form-select" id="category">
                            <option value="">— Select —</option>
                            <option>Internship Experience</option>
                            <option>Mentor Support</option>
                            <option>Work Environment</option>
                            <option>Learning Opportunities</option>
                            <option>Other</option>
                        </select></div>
                    <div class="form-group">
                        <label class="form-label">Overall Rating <span class="req">*</span></label>
                        <div class="rating-row" id="ratingRow">
                            <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span
                                class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star"
                                data-v="5">★</span>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">Subject <span class="req">*</span></label><input
                            type="text" class="form-input" id="subject" placeholder="Brief subject of your feedback" />
                    </div>
                    <div class="form-group"><label class="form-label">Your Feedback <span
                                class="req">*</span></label><textarea class="form-textarea" id="feedback"
                            placeholder="Share your internship experience, suggestions, or concerns here..."></textarea>
                    </div>
                    <div class="form-group"><label class="form-label">Suggestions for Improvement</label><textarea
                            class="form-textarea" id="suggestions"
                            placeholder="Any suggestions to improve the internship program..."></textarea></div>
                    <div class="btn-row">
                        <button class="btn btn-danger" id="btnReset"><svg viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="1 4 1 10 7 10" />
                                <path d="M3.51 15a9 9 0 1 0 .49-3.51" />
                            </svg>Reset</button>
                        <button class="btn btn-success" id="btnSubmit"><svg viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5">
                                <polyline points="20 6 9 17 4 12" />
                            </svg>Submit Feedback</button>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer"><span>Copyright &copy; <span id="yr"></span> <strong
                    style="color:#0ef;text-shadow:0 0 10px rgba(14,239,255,.9)">Thinkinfo Expert Solutions.</strong> All
                rights reserved.</span><span>Intern Panel v1.0</span></footer>
    </div>
    <div class="toast-wrap" id="toastWrap"></div>
    <script>
        (function () {
            document.getElementById('yr').textContent = new Date().getFullYear();
            var c = document.getElementById('matrixCanvas'), ctx = c.getContext('2d'), W, H, cols, drops, CH = 'アイウエオ01234ABCDEF';
            function resize() { W = c.width = innerWidth; H = c.height = innerHeight; cols = Math.floor(W / 18); drops = Array(cols).fill(1); } resize(); addEventListener('resize', resize);
            (function loop() { ctx.fillStyle = 'rgba(2,6,8,.06)'; ctx.fillRect(0, 0, W, H); ctx.font = '14px "Courier New"'; for (var i = 0; i < drops.length; i++) { ctx.fillStyle = 'rgba(14,239,255,.6)'; ctx.fillText(CH[Math.floor(Math.random() * CH.length)], i * 18, drops[i] * 18); if (drops[i] * 18 > H && Math.random() > .975) drops[i] = 0; drops[i]++; } requestAnimationFrame(loop); })();
            var tog = document.getElementById('menuToggle'), sb = document.getElementById('sidebar');
            tog && tog.addEventListener('click', function (e) { e.stopPropagation(); sb.classList.toggle('open'); });
            document.addEventListener('click', function (e) { if (sb && sb.classList.contains('open') && !sb.contains(e.target) && e.target !== tog) sb.classList.remove('open'); });
            // Stars
            var rating = 0, stars = document.querySelectorAll('.star');
            stars.forEach(function (s) {
                s.addEventListener('click', function () { rating = parseInt(this.getAttribute('data-v')); stars.forEach(function (x) { var v = parseInt(x.getAttribute('data-v')); x.classList.toggle('active', v <= rating); }); });
                s.addEventListener('mouseover', function () { var v = parseInt(this.getAttribute('data-v')); stars.forEach(function (x) { x.style.color = parseInt(x.getAttribute('data-v')) <= v ? 'var(--amber)' : 'var(--text-dim)'; }); });
                s.addEventListener('mouseout', function () { stars.forEach(function (x) { x.style.color = parseInt(x.getAttribute('data-v')) <= rating ? 'var(--amber)' : 'var(--text-dim)'; }); });
            });
            document.getElementById('btnSubmit').addEventListener('click', function () { var ok = true;['category', 'subject', 'feedback'].forEach(function (id) { var el = document.getElementById(id); if (!el.value || !el.value.trim()) { el.classList.add('error'); ok = false; } else el.classList.remove('error'); }); if (!rating) { toast('Please select a rating.', 'warn'); return; } if (!ok) { toast('Please fill all required fields.', 'warn'); return; } toast('Feedback submitted successfully! Thank you.');['subject', 'feedback', 'suggestions'].forEach(function (id) { document.getElementById(id).value = ''; }); document.getElementById('category').selectedIndex = 0; rating = 0; stars.forEach(function (s) { s.classList.remove('active'); s.style.color = 'var(--text-dim)'; }); });
            document.getElementById('btnReset').addEventListener('click', function () { ['category'].forEach(function (id) { document.getElementById(id).selectedIndex = 0; });['subject', 'feedback', 'suggestions'].forEach(function (id) { var el = document.getElementById(id); el.value = ''; el.classList.remove('error'); }); document.getElementById('category').classList.remove('error'); rating = 0; stars.forEach(function (s) { s.classList.remove('active'); s.style.color = 'var(--text-dim)'; }); toast('Form cleared.', 'warn'); });
            function toast(msg, type) { var w = document.getElementById('toastWrap'), t = document.createElement('div'); t.className = 'toast' + (type ? (' ' + type) : ''); t.textContent = msg; w.appendChild(t); setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 350); }, 3000); }
        })();
    </script>
</body>

</html>
